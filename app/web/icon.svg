<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" shape-rendering="crispEdges">
  <!-- 闻曲 Earworm · 8-bit 图标
       画布 = 32×32 像素网格，单格 16 单位。
       音符是 11×11 的精灵图（与菜单栏图标同一套像素），放大 32 倍放置，
       所以边缘全部落在整数格上，不会出现半像素。 -->
  <defs>
    <clipPath id="plate">
      <path d="M32 0h448v32h32v448h-32v32H32v-32H0V32h32z"/>
    </clipPath>
    <!-- 11×11 八分音符精灵 -->
    <g id="note">
      <!-- 符尾 -->
      <rect x="6" y="1" width="4" height="1"/>
      <rect x="8" y="2" width="2" height="1"/>
      <rect x="8" y="3" width="1" height="1"/>
      <!-- 符干 -->
      <rect x="6" y="1" width="2" height="9"/>
      <!-- 符头 -->
      <rect x="3" y="6" width="5" height="1"/>
      <rect x="2" y="7" width="6" height="1"/>
      <rect x="2" y="8" width="6" height="1"/>
      <rect x="3" y="9" width="5" height="1"/>
    </g>
  </defs>

  <!-- 机壳 -->
  <path d="M32 0h448v32h32v448h-32v32H32v-32H0V32h32z" fill="#0f1116"/>

  <g clip-path="url(#plate)">
    <!-- 内框：一格粗，离边 4 格 -->
    <rect x="72" y="72" width="368" height="368" fill="none" stroke="#e6b06a" stroke-width="16" opacity=".7"/>
  </g>

  <!-- 音符 -->
  <g transform="translate(64 80) scale(32)" fill="#e6b06a">
    <use href="#note"/>
  </g>
</svg>
