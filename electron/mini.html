<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>闻曲 · 迷你播放器</title>
<style>
  :root {
    --amber: #e6b06a;
    --ink: #e9e4d8;
    --dim: #8c9299;
    --bg1: #161a21;
    --bg2: #0b0d10;
    --serif: "Noto Serif SC", "Songti SC", "STSong", serif;
    --sans: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: linear-gradient(158deg, var(--bg1), var(--bg2) 62%);
    color: var(--ink); font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    user-select: none; cursor: default;
    -webkit-app-region: drag;
  }
  body::before {
    content: '';
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(120% 90% at 8% 0%, rgba(230,176,106,.13), transparent 62%),
      radial-gradient(90% 80% at 100% 110%, rgba(143,184,174,.08), transparent 60%);
  }
  .wrap {
    position: relative; height: 100%;
    display: flex; align-items: center; gap: 13px;
    padding: 0 16px;
  }

  /* 封面 */
  .cover-shell {
    position: relative; width: 66px; height: 66px; flex: 0 0 66px;
    border-radius: 12px; overflow: hidden;
    background: #1b2028;
    box-shadow: 0 8px 22px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .cover-shell img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 没有封面时的墨底「聞」：不留空洞 */
  .cover-shell::before {
    content: '聞';
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: var(--serif); font-size: 26px; color: rgba(230,176,106,.42);
    background: radial-gradient(circle at 30% 24%, rgba(230,176,106,.10), transparent 68%);
  }
  .cover-shell::after {
    content: ''; position: absolute; inset: 0; border-radius: 12px;
    box-shadow: inset 0 0 0 1px rgba(230,176,106,0);
    transition: box-shadow .5s ease;
  }
  body.playing .cover-shell::after { box-shadow: inset 0 0 0 1px rgba(230,176,106,.38); }

  /* 文本 */
  .meta { flex: 1 1 auto; min-width: 0; }
  .title {
    font-family: var(--serif); font-size: 15px; font-weight: 600;
    letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: #f4eee2;
  }
  .artist {
    margin-top: 3px; font-size: 11.5px; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .track {
    margin-top: 9px; height: 14px; display: flex; align-items: center; gap: 8px;
  }
  .bar {
    position: relative; flex: 1 1 auto; height: 3px; border-radius: 3px;
    background: rgba(255,255,255,.09); cursor: pointer;
    -webkit-app-region: no-drag;
  }
  .bar:hover { height: 5px; }
  .bar > i {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    border-radius: 3px;
    background: linear-gradient(90deg, rgba(230,176,106,.55), var(--amber));
    box-shadow: 0 0 10px rgba(230,176,106,.35);
  }
  .bar > b {
    position: absolute; top: 50%; left: 0%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px;
    border-radius: 50%; background: #f7e8ce; box-shadow: 0 0 8px rgba(230,176,106,.7);
    opacity: 0; transition: opacity .2s ease;
  }
  .bar:hover > b { opacity: 1; }
  .time { font-size: 10px; color: #6d747c; font-variant-numeric: tabular-nums; flex: 0 0 auto; }

  /* 控制 */
  .controls { display: flex; align-items: center; gap: 4px; -webkit-app-region: no-drag; }
  button {
    -webkit-app-region: no-drag;
    appearance: none; border: 0; background: transparent; color: #cfc9bd;
    width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer;
    transition: background .18s ease, color .18s ease, transform .12s ease;
  }
  button:hover { background: rgba(255,255,255,.07); color: #fff; }
  button:active { transform: scale(.93); }
  button svg { width: 15px; height: 15px; fill: currentColor; }
  .play {
    width: 40px; height: 40px; margin: 0 2px;
    background: radial-gradient(circle at 34% 26%, #f0c184, var(--amber) 58%, #c58f4b);
    color: #221a10; box-shadow: 0 6px 16px rgba(230,176,106,.28), inset 0 1px 0 rgba(255,255,255,.45);
  }
  .play:hover { background: radial-gradient(circle at 34% 26%, #f6cd93, #eebd7c 58%, #cf9955); color: #1b1409; }
  .play svg { width: 16px; height: 16px; }

  .divider { width: 1px; height: 38px; background: rgba(255,255,255,.09); margin: 0 8px; }
  .mini-actions { display: flex; flex-direction: column; gap: 2px; -webkit-app-region: no-drag; }
  .mini-actions button { width: 26px; height: 22px; border-radius: 6px; color: #767d85; }
  .mini-actions button:hover { color: var(--amber); }
  .mini-actions svg { width: 13px; height: 13px; }
  #pin.pinned { color: var(--amber); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="cover-shell"><img id="cover" alt=""></div>

    <div class="meta">
      <div class="title" id="title">没有正在播放的曲目</div>
      <div class="artist" id="artist">闻曲 · 听曲知雅意</div>
      <div class="track">
        <span class="time" id="pos">0:00</span>
        <div class="bar" id="bar"><i id="fill"></i><b id="knob"></b></div>
        <span class="time" id="dur">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button id="prev" title="上一首">
        <svg viewBox="0 0 24 24"><path d="M6 5h2.4v14H6zM20 5.6v12.8c0 .8-.9 1.3-1.6.9L9.1 13c-.7-.4-.7-1.4 0-1.8l9.3-6.4c.7-.5 1.6 0 1.6.8z"/></svg>
      </button>
      <button id="play" class="play" title="播放 / 暂停">
        <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.9l10-6.8c.6-.4.6-1.4 0-1.8l-10-6.8C8.9 3.9 8 4.4 8 5.2z"/></svg>
      </button>
      <button id="next" title="下一首">
        <svg viewBox="0 0 24 24"><path d="M15.6 5H18v14h-2.4zM4 5.6v12.8c0 .8.9 1.3 1.6.9L14.9 13c.7-.4.7-1.4 0-1.8L5.6 4.7C4.9 4.3 4 4.8 4 5.6z"/></svg>
      </button>
    </div>

    <div class="divider"></div>

    <div class="mini-actions">
      <button id="pin" title="置顶">
        <svg viewBox="0 0 24 24"><path d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2l-2-2z"/></svg>
      </button>
      <button id="expand" title="打开主窗口">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3H4zm16 0h-2V6h-3V4h5v5zM4 15h2v3h3v2H4v-5zm14 3v-3h2v5h-5v-2h3z"/></svg>
      </button>
      <button id="close" title="关闭迷你播放器">
        <svg viewBox="0 0 24 24"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/></svg>
      </button>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (s) => {
    if (!Number.isFinite(s) || s <= 0) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return `${m}:${String(sec).padStart(2, '0')}`;
  };

  const PLAY_PATH = 'M8 5.2v13.6c0 .8.9 1.3 1.6.9l10-6.8c.6-.4.6-1.4 0-1.8l-10-6.8C8.9 3.9 8 4.4 8 5.2z';
  const PAUSE_PATH = 'M7 4h3.4v16H7zM13.6 4H17v16h-3.4z';

  let current = { duration: 0 };

  function render(state) {
    if (!state) return;
    current = state;
    document.body.classList.toggle('playing', !!state.playing);

    $('title').textContent = state.name || '没有正在播放的曲目';
    $('artist').textContent = state.artist || '闻曲 · 听曲知雅意';

    const cover = $('cover');
    if (state.cover && cover.getAttribute('src') !== state.cover) cover.src = state.cover;

    $('play-icon').innerHTML = `<path d="${state.playing ? PAUSE_PATH : PLAY_PATH}"/>`;

    const dur = state.duration || 0;
    const pos = Math.min(state.position || 0, dur || 0);
    const pct = dur > 0 ? (pos / dur) * 100 : 0;
    $('fill').style.width = pct + '%';
    $('knob').style.left = pct + '%';
    $('pos').textContent = fmt(pos);
    $('dur').textContent = fmt(dur);
  }

  $('prev').onclick = () => window.ewMini.send('prev');
  $('next').onclick = () => window.ewMini.send('next');
  $('play').onclick = () => window.ewMini.send('toggle');
  $('close').onclick = () => window.ewMini.action('close');
  $('expand').onclick = () => window.ewMini.action('open-main');
  $('pin').onclick = () => window.ewMini.action('pin');

  $('bar').addEventListener('pointerdown', (event) => {
    const rect = event.currentTarget.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
    window.ewMini.seek(ratio);
  });

  document.addEventListener('dblclick', (event) => {
    if (event.target.closest('button') || event.target.closest('.bar')) return;
    window.ewMini.action('open-main');
  });

  window.addEventListener('keydown', (event) => {
    if (event.code === 'Space') { event.preventDefault(); window.ewMini.send('toggle'); }
    if (event.code === 'ArrowRight' && event.metaKey) window.ewMini.send('next');
    if (event.code === 'ArrowLeft' && event.metaKey) window.ewMini.send('prev');
    if (event.key === 'Escape') window.ewMini.action('close');
  });

  window.ewMini.onState(render);
  window.ewMini.onFlags((flags) => {
    $('pin').classList.toggle('pinned', !!flags.alwaysOnTop);
  });
  window.ewMini.initialState().then(render);
</script>
</body>
</html>
