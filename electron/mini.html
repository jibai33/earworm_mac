<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>闻曲 · 迷你播放器</title>
<style>
  /* 像素风迷你播放器：与主窗口同一套色板与像素字，2px 实线边框 + 零圆角 */
  @font-face {
    font-family: 'Ark Pixel 12';
    src: url('../app/web/fonts/ark-pixel-12.woff2') format('woff2');
    font-display: block;
  }
  :root {
    --px-0: #08090c;
    --px-1: #0e1014;
    --px-2: #151920;
    --px-3: #1d232c;
    --px-line: #2b323d;
    --px-txt: #eae4d6;
    --px-dim: #98a0a8;
    --px-amber: #e6b06a;
    --px-amber-hi: #f6cd93;
    --pixel-font: 'Ark Pixel 12', 'PingFang SC', monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--px-1);
    color: var(--px-txt); font-family: var(--pixel-font);
    -webkit-font-smoothing: none;
    font-size: 12px; line-height: 1.6;
    user-select: none; cursor: default;
    -webkit-app-region: drag;
  }
  /* CRT 扫描线 */
  body::before {
    content: '';
    position: absolute; inset: 0; pointer-events: none; z-index: 9;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 2px, transparent 2px 4px);
  }
  .wrap {
    position: relative; height: 100%;
    display: flex; align-items: center; gap: 12px;
    padding: 0 14px;
  }

  /* 封面 */
  .cover-shell {
    position: relative; width: 64px; height: 64px; flex: 0 0 64px;
    background: var(--px-2) center/cover no-repeat;
    border: 2px solid var(--px-line);
    box-shadow: 3px 3px 0 rgba(0,0,0,.85);
  }
  .cover-shell img {
    position: relative; z-index: 1; width: 100%; height: 100%;
    object-fit: cover; display: block; image-rendering: pixelated;
  }
  /* 没有封面时的像素音符占位 */
  .cover-shell::before {
    content: '';
    position: absolute; inset: 0;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 11 11' shape-rendering='crispEdges'><g fill='%23e6b06a'><rect x='6' y='1' width='4' height='1'/><rect x='8' y='2' width='2' height='1'/><rect x='8' y='3' width='1' height='1'/><rect x='6' y='1' width='2' height='9'/><rect x='3' y='6' width='5' height='1'/><rect x='2' y='7' width='6' height='1'/><rect x='2' y='8' width='6' height='1'/><rect x='3' y='9' width='5' height='1'/></g></svg>") center / 44px 44px no-repeat;
    opacity: .55;
  }
  body.playing .cover-shell { border-color: var(--px-amber); }

  /* 文本 */
  .meta { flex: 1 1 auto; min-width: 0; }
  .title {
    font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--px-txt);
  }
  .artist {
    font-size: 12px; color: var(--px-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* 进度：分段色块 */
  .track { margin-top: 6px; height: 16px; display: flex; align-items: center; gap: 8px; }
  .bar {
    position: relative; flex: 1 1 auto; height: 10px;
    background: var(--px-2); border: 2px solid var(--px-line);
    cursor: pointer; -webkit-app-region: no-drag;
  }
  .bar:hover { border-color: var(--px-amber); }
  .bar > i {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: repeating-linear-gradient(90deg, var(--px-amber) 0 6px, transparent 6px 8px);
  }
  .bar > b { display: none; }
  .time { font-size: 12px; color: #7f8794; flex: 0 0 auto; }

  /* 控制 */
  .controls { display: flex; align-items: center; gap: 6px; -webkit-app-region: no-drag; }
  button {
    -webkit-app-region: no-drag;
    appearance: none; border: 2px solid transparent; border-radius: 0;
    background: transparent; color: var(--px-dim);
    width: 28px; height: 28px; padding: 0;
    display: grid; place-items: center; cursor: pointer;
    transition: none;
  }
  button:hover { background: var(--px-3); border-color: var(--px-line); color: var(--px-txt); }
  button:active { background: var(--px-2); }
  button svg { width: 22px; height: 22px; fill: currentColor; shape-rendering: crispEdges; }
  .play {
    width: 36px; height: 36px;
    background: var(--px-amber); color: #1b1409;
    border-color: var(--px-amber-hi);
    box-shadow: 3px 3px 0 rgba(0,0,0,.85);
  }
  .play:hover { background: var(--px-amber-hi); color: #1b1409; }

  .divider { width: 2px; height: 34px; background: var(--px-line); margin: 0 6px; }
  .mini-actions { display: flex; flex-direction: column; gap: 2px; -webkit-app-region: no-drag; }
  .mini-actions button { width: 24px; height: 22px; color: #767d85; }
  .mini-actions button:hover { color: var(--px-amber); }
  .mini-actions svg { width: 18px; height: 18px; }
  #pin.pinned { color: var(--px-amber); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="cover-shell"><img id="cover" alt=""></div>

    <div class="meta">
      <div class="title" id="title">没有正在播放的曲目</div>
      <div class="artist" id="artist">闻曲 · 听曲知雅意</div>
      <div class="track">
        <span class="time" id="pos">0:00</span>
        <div class="bar" id="bar"><i id="fill"></i><b id="knob"></b></div>
        <span class="time" id="dur">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button id="prev" title="上一首">
        <svg id="prev-icon" viewBox="0 0 11 11"></svg>
      </button>
      <button id="play" class="play" title="播放 / 暂停">
        <svg id="play-icon" viewBox="0 0 11 11"></svg>
      </button>
      <button id="next" title="下一首">
        <svg id="next-icon" viewBox="0 0 11 11"></svg>
      </button>
    </div>

    <div class="divider"></div>

    <div class="mini-actions">
      <button id="pin" title="置顶">
        <svg viewBox="0 0 11 11"><rect x="4" y="1" width="3" height="5"/><rect x="3" y="6" width="5" height="1"/><rect x="5" y="7" width="1" height="3"/></svg>
      </button>
      <button id="expand" title="打开主窗口">
        <svg viewBox="0 0 11 11"><g><rect x="1" y="1" width="4" height="1"/><rect x="1" y="1" width="1" height="4"/><rect x="6" y="1" width="4" height="1"/><rect x="9" y="1" width="1" height="4"/><rect x="1" y="9" width="4" height="1"/><rect x="1" y="6" width="1" height="4"/><rect x="6" y="9" width="4" height="1"/><rect x="9" y="6" width="1" height="4"/></g></svg>
      </button>
      <button id="close" title="关闭迷你播放器">
        <svg viewBox="0 0 11 11"><g><rect x="2" y="2" width="2" height="1"/><rect x="7" y="2" width="2" height="1"/><rect x="3" y="3" width="2" height="1"/><rect x="6" y="3" width="2" height="1"/><rect x="4" y="4" width="3" height="1"/><rect x="3" y="6" width="2" height="1"/><rect x="6" y="6" width="2" height="1"/><rect x="2" y="7" width="2" height="1"/><rect x="7" y="7" width="2" height="1"/></g></svg>
      </button>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (s) => {
    if (!Number.isFinite(s) || s <= 0) return '0:00';
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return `${m}:${String(sec).padStart(2, '0')}`;
  };

  /* 控制图标：11×11 像素格，用矩形拼，和主界面同一套 8-bit 语言 */
  const R = (list) => list.map(([x, y, w, h]) => `<rect x="${x}" y="${y}" width="${w}" height="${h}"/>`).join('');
  const ICON_PLAY = R([[4, 0, 1, 7], [5, 1, 1, 5], [6, 2, 1, 3], [7, 3, 1, 1]]);
  const ICON_PAUSE = R([[3, 1, 2, 7], [6, 1, 2, 7]]);
  const ICON_PREV = R([[2, 1, 2, 7], [7, 0, 1, 7], [6, 1, 1, 5], [5, 2, 1, 3], [4, 3, 1, 1]]);
  const ICON_NEXT = R([[3, 0, 1, 7], [4, 1, 1, 5], [5, 2, 1, 3], [6, 3, 1, 1], [8, 1, 2, 7]]);

  $('prev-icon').innerHTML = ICON_PREV;
  $('next-icon').innerHTML = ICON_NEXT;

  let current = { duration: 0 };

  function render(state) {
    if (!state) return;
    current = state;
    document.body.classList.toggle('playing', !!state.playing);

    $('title').textContent = state.name || '没有正在播放的曲目';
    $('artist').textContent = state.artist || '闻曲 · 听曲知雅意';

    const cover = $('cover');
    if (state.cover && cover.getAttribute('src') !== state.cover) cover.src = state.cover;

    $('play-icon').innerHTML = state.playing ? ICON_PAUSE : ICON_PLAY;

    const dur = state.duration || 0;
    const pos = Math.min(state.position || 0, dur || 0);
    const pct = dur > 0 ? (pos / dur) * 100 : 0;
    $('fill').style.width = pct + '%';
    $('knob').style.left = pct + '%';
    $('pos').textContent = fmt(pos);
    $('dur').textContent = fmt(dur);
  }

  $('prev').onclick = () => window.ewMini.send('prev');
  $('next').onclick = () => window.ewMini.send('next');
  $('play').onclick = () => window.ewMini.send('toggle');
  $('close').onclick = () => window.ewMini.action('close');
  $('expand').onclick = () => window.ewMini.action('open-main');
  $('pin').onclick = () => window.ewMini.action('pin');

  $('bar').addEventListener('pointerdown', (event) => {
    const rect = event.currentTarget.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
    window.ewMini.seek(ratio);
  });

  document.addEventListener('dblclick', (event) => {
    if (event.target.closest('button') || event.target.closest('.bar')) return;
    window.ewMini.action('open-main');
  });

  window.addEventListener('keydown', (event) => {
    if (event.code === 'Space') { event.preventDefault(); window.ewMini.send('toggle'); }
    if (event.code === 'ArrowRight' && event.metaKey) window.ewMini.send('next');
    if (event.code === 'ArrowLeft' && event.metaKey) window.ewMini.send('prev');
    if (event.key === 'Escape') window.ewMini.action('close');
  });

  window.ewMini.onState(render);
  window.ewMini.onFlags((flags) => {
    $('pin').classList.toggle('pinned', !!flags.alwaysOnTop);
  });
  window.ewMini.initialState().then(render);
</script>
</body>
</html>
